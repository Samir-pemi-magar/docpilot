services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://docpilot:docpilot@postgres:5432/docpilot
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: docpilot
      MINIO_SECRET_KEY: docpilot-minio-password
      MINIO_BUCKET: documents
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - minio

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: docpilot
      POSTGRES_PASSWORD: docpilot
      POSTGRES_DB: docpilot
    volumes:
      - postgres_data:/var/lib/postgresql/data


  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: quay.io/minio/minio
    environment:
      MINIO_ROOT_USER: docpilot
      MINIO_ROOT_PASSWORD: docpilot-minio-password
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:89-1.9
    command:
      - --model-id
      - Qwen/Qwen3-Embedding-0.6B
      - --dtype
      - float16
    ports:
      - "8081:80"
    volumes:
      - embedding_data:/data
    shm_size: "1gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
  embedding_data: